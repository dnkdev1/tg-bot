<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TG Bot Admin</title>
    <script>
      // Set the theme before the first paint, so dark mode never flashes white.
      // Same storage key and logic as src/lib/useTheme.ts.
      try {
        var saved = localStorage.getItem('tg-admin-theme')
        var system = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = saved === 'dark' || saved === 'light' ? saved : system
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
